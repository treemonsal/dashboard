<title>Tims Dashboard Entwurf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Schibsted+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: schmale Textleiste links, daneben ein Tagesblatt. Zahlen gross und ruhig, alles andere an Haarlinien ausgerichtet. */
:root{
  --bg:#EEF0EE; --surface:#FAFBFA; --ink:#0F1412; --muted:#5C6661; --line:#D3D9D5;
  --accent:#0B5C5A; --accent-soft:#DCE9E7; --warn:#94580A; --warn-soft:#F3E7D2;
  --display:"Schibsted Grotesk","Geist",system-ui,sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B100F; --surface:#121918; --ink:#E6EBE8; --muted:#8C9893; --line:#222B29;
  --accent:#62C4BA; --accent-soft:#16302E; --warn:#E0A552; --warn-soft:#33270F; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B100F; --surface:#121918; --ink:#E6EBE8; --muted:#8C9893; --line:#222B29;
  --accent:#62C4BA; --accent-soft:#16302E; --warn:#E0A552; --warn-soft:#33270F; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.shell{max-width:1120px;margin:0 auto;padding-block:28px 64px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:168px minmax(0,1fr);gap:56px}
nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 28px);align-self:start}
nav .mark{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 0 18px}
nav button{text-align:left;padding:7px 0;color:var(--muted);transition:color .16s}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{color:var(--ink);font-weight:500}
nav button[aria-current="page"]::before{content:"";display:inline-block;width:14px;height:1.5px;background:var(--accent);vertical-align:middle;margin-right:10px}
main{min-width:0}
.view{animation:in .22s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}

.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:500;font-size:clamp(30px,5vw,44px);letter-spacing:-.025em;line-height:1.05;margin:6px 0 0;text-wrap:balance}
h2{font-family:var(--body);font-weight:500;font-size:15px;margin:0}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid var(--line)}
.next{max-width:360px;color:var(--muted)}
.next b{color:var(--ink);font-weight:500}

.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:56px;padding-top:28px}
section{display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:40px;min-width:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.eg{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 5px}

.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.task{grid-template-columns:20px minmax(0,1fr) auto;text-align:left;width:100%}
.box{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;transition:background .16s,border-color .16s}
.box svg{opacity:0;transform:scale(.6);transition:opacity .16s,transform .2s cubic-bezier(.3,1.6,.5,1)}
.task[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.task[aria-pressed="true"] .box svg{opacity:1;transform:none}
.task .t{transition:color .2s}
.task[aria-pressed="true"] .t{color:var(--muted);text-decoration:line-through}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.exam{grid-template-columns:78px minmax(0,1fr) auto;text-align:left;width:100%;transition:background .16s}
.exam:hover{background:var(--surface)}
.exam .d{white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.exam .s{font-weight:500}
.exam .s span{font-weight:400;color:var(--muted)}
.days{font-family:var(--display);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:right}
.days small{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--muted);letter-spacing:.06em;margin-left:4px}
.chip{display:inline-block;font-size:11px;color:var(--warn);background:var(--warn-soft);border-radius:3px;padding:1px 6px;margin-left:8px;white-space:nowrap}

.stat{display:flex;flex-direction:column;gap:2px;padding:14px 0;border-bottom:1px solid var(--line)}
.stat:first-child{border-top:1px solid var(--line)}
.stat .v{font-family:var(--display);font-weight:500;font-size:30px;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:14px;color:var(--muted);letter-spacing:0;margin-left:4px;font-family:var(--body);font-weight:400}
.stat .k{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted)}

.back{color:var(--muted);font-size:13px;margin-bottom:18px}
.back:hover{color:var(--ink)}
.facts{display:flex;gap:28px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:10px}
.facts b{display:block;color:var(--ink);font-weight:500;font-size:15px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s cubic-bezier(.2,.7,.2,1)}
.topic{grid-template-columns:minmax(0,1fr) auto}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:5px 10px;font-size:12px;color:var(--muted);transition:background .16s,color .16s}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.plan{grid-template-columns:72px minmax(0,1fr) auto}
.cta{align-self:start;border:1px solid var(--ink);border-radius:6px;padding:9px 14px;font-weight:500;transition:background .16s,color .16s}
.cta:hover{background:var(--ink);color:var(--bg)}
.empty{padding:48px 0;color:var(--muted);max-width:46ch}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:16px 48px}
  nav{position:static;flex-direction:row;gap:18px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  nav .mark{display:none}
  nav button{white-space:nowrap;padding:6px 0}
  nav button[aria-current="page"]::before{display:none}
  nav button[aria-current="page"]{box-shadow:0 1.5px 0 var(--accent)}
  .cols{grid-template-columns:minmax(0,1fr);gap:40px}
  .exam{grid-template-columns:70px minmax(0,1fr) auto}
}
</style>

<div class="shell">
  <nav aria-label="Bereiche">
    <div class="mark">Tim · KW 46</div>
    <button data-go="heute" aria-current="page">Heute</button>
    <button data-go="aufgaben">Aufgaben</button>
    <button data-go="kalender">Kalender</button>
    <button data-go="schule">Schule</button>
    <button data-go="finanzen">Finanzen</button>
    <button data-go="gesundheit">Gesundheit</button>
  </nav>
  <main id="main"></main>
</div>

<script>
const check='<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5.2 4.2 7.4 8 3" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// Echt: aus Tims Google Kalender (Stand der Einträge: 13.9.2026)
const exams=[
 {id:"wr1",d:"Fr 27.11.",f:"W+R",t:"Kapitel 3: Organisation und Personal",n:14,time:"10:10 bis 11:50",room:"LI208",src:"Teams, W+R, Terminplan 1. Semester",topics:["Kapitel 3: Organisation","Kapitel 3: Personal"]},
 {id:"frw",d:"Do 3.12.",f:"FRW",t:"Kapitel 11 bis 17",n:20,time:"09:15 bis 11:50",room:"LI208",src:"Teams, FRW, Terminplan 1. Semester",topics:["Kapitel 11","Kapitel 12","Kapitel 13","Kapitel 14","Kapitel 15","Kapitel 16","Kapitel 17"]},
 {id:"tu",d:"Fr 4.12.",f:"T+U",t:"Solar system",n:21,time:"08:15 bis 10:00",room:"LI121",src:"Teams, T+U, tests term 1",topics:["Solar system"]},
 {id:"e",d:"Fr 11.12.",f:"E",t:"CAE/CPE listening",n:28,time:"06:30 bis 08:05",room:"LI121",src:"Teams, E, Forthcoming tests",flag:"Uhrzeit prüfen",topics:["CAE/CPE listening"]},
 {id:"m",d:"Do 7.1.",f:"M",t:"Test 3: Rational numbers",n:55,time:"08:15 bis 09:00",room:"LI220",src:"Teams, M, Jahresplan 2026-2027",topics:["Rational numbers"]},
 {id:"wr2",d:"Fr 22.1.",f:"W+R",t:"Kapitel 4 und 5, zählt fürs 2. Semester",n:70,time:"10:10 bis 11:50",room:"LI208",src:"Teams, W+R, Terminplan 1. Semester",topics:["Kapitel 4","Kapitel 5"]}
];
const tasks=[["FRW Kapitel 11 und 12 repetieren","45 min"],["W+R Kapitel 3 zusammenfassen","30 min"],["Lerndokumentation November schreiben","bis So"],["Bank-Exporte hochladen","monatlich"]];
const done=new Set(), conf={};
const main=document.getElementById("main");
const views={
 heute(){return `<div class="view">
  <div class="head"><div><div class="label">Freitag</div><h1>13. November</h1></div>
   <p class="next">Nächste Prüfung in <b>14 Tagen</b>: W+R, Organisation und Personal. Danach drei Prüfungen in acht Tagen.</p></div>
  <div class="cols"><div class="stack">
   <section><div class="sec-head"><h2>Heute</h2><span class="eg">Beispiel</span></div>
    <div class="rows">${tasks.map((t,i)=>`<button class="row task" data-task="${i}" aria-pressed="${done.has(i)}"><span class="box">${check}</span><span class="t">${t[0]}</span><span class="meta">${t[1]}</span></button>`).join("")}</div></section>
   <section><div class="sec-head"><h2>Prüfungen</h2><span class="note">aus deinem Kalender</span></div>
    <div class="rows">${exams.map(e=>`<button class="row exam" data-exam="${e.id}"><span class="d">${e.d}</span><span class="s">${e.f} <span>${e.t}</span>${e.flag?`<span class="chip">${e.flag}</span>`:""}</span><span class="days">${e.n}<small>T</small></span></button>`).join("")}</div></section>
  </div>
  <section><div class="sec-head"><h2>Stand</h2><span class="eg">Beispiel</span></div>
   <div><div class="stat"><span class="v">4.9</span><span class="k">Notenschnitt, 1. Semester</span></div>
   <div class="stat"><span class="v">7<small>h</small> 12<small>min</small></span><span class="k">Schlaf letzte Nacht</span></div>
   <div class="stat"><span class="v">214<small>CHF</small></span><span class="k">übrig bis Monatsende</span></div></div>
   <p class="note">Schulabgleich jeden Sonntag. Noten und neue Prüfungen kommen von selbst.</p></section></div></div>`},
 exam(id){const e=exams.find(x=>x.id===id);conf[id]=conf[id]||{};const c=conf[id];
  const ok=e.topics.filter((_,i)=>c[i]===2).length;
  return `<div class="view"><button class="back" data-go="heute">Zurück zu Heute</button>
  <div class="head"><div><div class="label">${e.f} · ${e.d}</div><h1>${e.t}</h1>
   <div class="facts"><span><b>${e.n} Tage</b>bis zur Prüfung</span><span><b>${e.time}</b>${e.flag?`<span class="chip" style="margin:0">${e.flag}</span>`:"Zeit"}</span><span><b>${e.room}</b>Zimmer</span></div></div></div>
  <div class="cols"><div class="stack">
   <section><div class="sec-head"><h2>Was drankommt</h2><span class="meta">${ok} von ${e.topics.length} sitzen</span></div>
    <div class="bar"><i style="width:${ok/e.topics.length*100}%"></i></div>
    <div class="rows">${e.topics.map((t,i)=>`<div class="row topic"><span>${t}</span><span class="seg">${["offen","unsicher","sitzt"].map((l,k)=>`<button data-conf="${id}:${i}:${k}" aria-pressed="${(c[i]||0)===k}">${l}</button>`).join("")}</span></div>`).join("")}</div>
    <p class="note">Quelle: ${e.src}. Lernziele und Unterthemen holt der Sonntagslauf aus dem Klassennotizbuch.</p></section>
  </div>
  <section><div class="sec-head"><h2>Lernplan</h2><span class="eg">Vorschlag</span></div>
   <div class="rows"><div class="row plan"><span class="meta">${e.n-12>0?"in "+(e.n-12)+" T":"heute"}</span><span>Stoff durchgehen, Lücken markieren</span><span class="meta">45 min</span></div>
   <div class="row plan"><span class="meta">${e.n-6>0?"in "+(e.n-6)+" T":"heute"}</span><span>Unsichere Themen mit Aufgaben üben</span><span class="meta">60 min</span></div>
   <div class="row plan"><span class="meta">in ${e.n-2} T</span><span>Abfragen ohne Unterlagen</span><span class="meta">30 min</span></div>
   <div class="row plan"><span class="meta">in ${e.n-1} T</span><span>Nur noch Offenes, früh schlafen</span><span class="meta">20 min</span></div></div>
   <button class="cta">Als Aufgaben übernehmen</button>
   <p class="note">Der Plan richtet sich nach deinen Markierungen links und nach den anderen Prüfungen in derselben Woche.</p></section></div></div>`},
 leer(n){return `<div class="view"><div class="head"><div><div class="label">Bereich</div><h1>${n}</h1></div></div><p class="empty">Noch nicht entworfen. Zuerst muss die Richtung auf der Seite Heute stimmen, dann folgen die anderen Bereiche im selben Stil.</p></div>`}
};
let cur=["heute"];
function show(v,arg){cur=[v,arg];main.innerHTML=v==="exam"?views.exam(arg):v==="heute"?views.heute():views.leer(arg);
 document.querySelectorAll("nav button").forEach(b=>{const on=b.dataset.go===(v==="exam"?"schule":v==="leer"?arg.toLowerCase():v);on?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current")});}
document.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;
 if(b.dataset.go){const g=b.dataset.go;g==="heute"?show("heute"):g==="schule"?show("exam","frw"):show("leer",b.textContent);window.scrollTo(0,0)}
 else if(b.dataset.exam){show("exam",b.dataset.exam);window.scrollTo(0,0)}
 else if(b.dataset.task){const i=+b.dataset.task;done.has(i)?done.delete(i):done.add(i);b.setAttribute("aria-pressed",done.has(i))}
 else if(b.dataset.conf){const [id,i,k]=b.dataset.conf.split(":");conf[id][i]=+k;const e=exams.find(x=>x.id===id);
  b.parentNode.querySelectorAll("button").forEach((x,j)=>x.setAttribute("aria-pressed",j===+k));
  const ok=e.topics.filter((_,j)=>conf[id][j]===2).length;main.querySelector(".bar i").style.width=ok/e.topics.length*100+"%";main.querySelector(".sec-head .meta").textContent=ok+" von "+e.topics.length+" sitzen"}
 else if(b.classList.contains("cta")){b.textContent="Übernommen";b.disabled=true}
});
show("heute");
</script>
